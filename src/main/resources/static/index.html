<!DOCTYPE html>
<html lang="zh-CN"> <!-- 建议改为 zh-CN -->
<head>
    <!-- 1. 核心：强制指定 UTF-8 编码 -->
    <meta charset="UTF-8">

    <title>my agent</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        #chat-box { border: 1px solid #ccc; height: 400px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #f9f9f9; }
        .message { margin-bottom: 10px; padding: 8px; border-radius: 5px; }
        .user { text-align: right; background: #e1f5fe; }
        .ai { text-align: left; background: #fff; border: 1px solid #eee; }
        input { width: 70%; padding: 10px; }
        button { width: 25%; padding: 10px; background: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
<h2>my agent</h2>
<div id="chat-box"></div>
<div>
    <input type="text" id="userInput" placeholder="输入指令，例如：列出当前文件，或者读取 log.txt" />
    <button onclick="sendMessage()">发送</button>
</div>

<script>
    function sendMessage() {
        const input = document.getElementById('userInput');
        const message = input.value.trim();
        if (!message) return;

        // 显示用户消息
        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML += `<div class="message user">我: ${message}</div>`;
        input.value = '';

        // 发送给后端
        fetch('/api/file/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: message })
        })
            .then(res => res.text())
            .then(data => {
                chatBox.innerHTML += `<div class="message ai">AI: ${data}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            });
    }

    // 回车发送
    document.getElementById('userInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') sendMessage();
    });
</script>
</body>
</html>
