<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 本地 AI 助手</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; height: 100vh; margin: 0; }
        .chat-container { width: 800px; background: white; display: flex; flex-direction: column; height: 100%; box-shadow: 0 0 10px rgba(0,0,0,0.1); }

        /* 标题栏 */
        .header { padding: 15px; border-bottom: 1px solid #eee; text-align: center; }
        .description { font-size: 0.9em; color: #666; margin-top: 5px; }

        /* 消息显示区域 */
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }

        .message { padding: 10px 15px; border-radius: 10px; max-width: 80%; line-height: 1.5; }
        .user { align-self: flex-end; background-color: #dcf8c6; color: #000; }
        .assistant { align-self: flex-start; background-color: #f1f0f0; color: #000; }

        /* 输入区域 */
        .input-area { padding: 20px; border-top: 1px solid #eee; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none; }
        button { padding: 10px 20px; background-color: #19c37d; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <h2>🤖 本地 AI 助手</h2>
        <div class="description">基于 Spring AI 连接本地大模型</div>
    </div>

    <div id="chat-box">
        <!-- 消息会插在这里 -->
        <div class="message assistant">你好！有什么我可以帮你的吗？</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="输入消息..." autocomplete="off">
        <button id="send-btn" onclick="sendMessage()">发送</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    // 监听回车键
    userInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') sendMessage();
    });

    function sendMessage() {
        const message = userInput.value.trim();
        if (!message) return;

        // 1. 显示用户消息
        addMessage('user', message);
        userInput.value = '';
        userInput.disabled = true;
        sendBtn.disabled = true;

        // 2. 创建 AI 的占位消息
        const aiMessageDiv = addMessage('assistant', '思考中...');
        let fullAiResponse = "";

        // 3. 使用 EventSource 连接后端流接口 (SSE)
        // 注意：这里要对 message 进行 URL 编码，防止中文乱码
        const eventSource = new EventSource(`/ai/chat?message=${encodeURIComponent(message)}`);

        eventSource.onmessage = function(event) {
            // 收到后端传来的一个字/片段
            const chunk = event.data;

            // 如果是第一次收到有效数据，清空"思考中..."
            if (fullAiResponse.length === 0 && chunk) {
                aiMessageDiv.innerText = "";
            }

            // 拼接内容并显示打字机效果
            fullAiResponse += chunk;
            aiMessageDiv.innerText = fullAiResponse;

            // 自动滚动到底部
            chatBox.scrollTop = chatBox.scrollHeight;
        };

        eventSource.onerror = function() {
            eventSource.close();
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
        };

        // 当连接关闭时（通常由 Spring AI 流结束自动触发，或者手动处理）
        eventSource.addEventListener('close', () => {
            eventSource.close();
            userInput.disabled = false;
            sendBtn.disabled = false;
        });
    }

    function addMessage(role, text) {
        const div = document.createElement('div');
        div.className = `message ${role}`;
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return div;
    }
</script>

</body>
</html>
